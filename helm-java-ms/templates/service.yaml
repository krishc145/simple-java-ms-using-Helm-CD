apiVersion: v1
kind: Service
metadata:
  name: {{ include "simple-java-ms.fullname" . }}
  labels:
    app: {{ include "simple-java-ms.name" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      nodePort: {{ .Values.service.nodePort | default 30080 }}
      protocol: TCP
      name: http
  selector:
    app: {{ include "simple-java-ms.name" . }}
